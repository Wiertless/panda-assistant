name: eval
# Scores models on the assistant's scenarios (core/eval/scenarios.json) with
# llama.cpp on the CPU, since runners have no NPU. Same prompt, tool schemas
# and routing as on the laptop; quantization differs from FastFlowLM's, so
# treat the scores as a comparison, and run `assistantd --eval` there for the
# real thing. Run it by hand with several variants (core/eval/variants.json)
# to compare prompts and harness settings.
on:
  workflow_dispatch:
    inputs:
      variants:
        description: 'Variants to compare, as JSON: ["baseline", "no-harness"]'
        required: false
        default: '["baseline"]'
      only:
        description: Run only scenarios whose name contains this
        required: false
      models:
        description: 'Only these models (comma-separated, e.g. gemma4-it:e2b); empty for all'
        required: false
      shards:
        description: 'Parallel parts: 3, 4 or 6 (more for repeat > 2: each part must stay under 3 h)'
        required: false
        default: '3'
      repeat:
        description: Runs per scenario
        required: false
        default: '1'
  push:
    branches: [main]
    paths:
      - core/src/agent.rs
      - core/src/eval.rs
      - core/src/repair.rs
      - core/src/tools/**
      - core/eval/**
      - .github/workflows/eval.yml

permissions:
  contents: read

# A push supersedes the last push's run; runs started by hand are left alone.
concurrency:
  group: eval-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || 'push' }}
  cancel-in-progress: true

jobs:
  # The models to score: all of them, or the ones the run asked for. Unwanted
  # models get no jobs at all (they used to start and skip, and queue the rest).
  plan:
    runs-on: ubuntu-24.04
    outputs:
      models: ${{ steps.pick.outputs.models }}
    steps:
      - id: pick
        env:
          WANT: ${{ inputs.models }}
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          all = [
              {"model": "gemma4-it:e2b", "search": "gemma-4-E2B-it"},
              # Google's quantization-aware-trained 4-bit build (llama.cpp only; FLM has none).
              {"model": "gemma4-it:e2b-qat", "search": "gemma-4-E2B-it-qat-q4_0-gguf", "quant": "Q4_0"},
              {"model": "gemma4-it:e4b", "search": "gemma-4-E4B-it"},
              {"model": "qwen3.5:2b", "search": "Qwen3.5-2B"},
              {"model": "qwen3.5:4b", "search": "Qwen3.5-4B"},
              {"model": "qwen3-it:4b", "search": "Qwen3-4B-Instruct-2507"},
          ]
          want = [w.strip() for w in os.environ["WANT"].split(",") if w.strip()]
          picked = [m for m in all if not want or m["model"] in want]
          missing = [w for w in want if w not in [m["model"] for m in all]]
          if missing or not picked:
              raise SystemExit(f"unknown models: {missing}; known: {[m['model'] for m in all]}")
          print("models=" + json.dumps(picked))
          PY

  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install build dependencies
        run: sudo apt-get update -q && sudo apt-get install -y -q libglib2.0-dev libgdk-pixbuf-2.0-dev libpango1.0-dev libcairo2-dev
      - name: Build assistantd
        run: cargo build --release --locked -p assistant-core
      - uses: actions/upload-artifact@v4
        with:
          name: assistantd
          path: target/release/assistantd

  eval:
    needs: [plan, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        variant: ${{ fromJSON(inputs.variants || '["baseline"]') }}
        # 160 families take ~3.5 h on one runner: three in parallel stay under the 3 h job limit.
        shard: ${{ fromJSON(format('[{0}]', inputs.shards == '6' && '0,1,2,3,4,5' || inputs.shards == '4' && '0,1,2,3' || '0,1,2')) }}
        m: ${{ fromJSON(needs.plan.outputs.models) }}
    name: eval (${{ matrix.m.model }}, ${{ matrix.variant }}, ${{ matrix.shard }}/${{ inputs.shards || '3' }})
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@v4
        with:
          name: assistantd
      - name: Find and download the GGUF
        id: gguf
        run: |
          read -r repo file < <(python3 .github/scripts/find_gguf.py "${{ matrix.m.search }}" "${{ matrix.m.quant || 'Q4_K_M' }}")
          echo "Using $repo / $file"
          echo "source=$repo/$file" >> "$GITHUB_OUTPUT"
          mkdir -p models
          curl -sSfL --retry 3 -o models/model.gguf "https://huggingface.co/$repo/resolve/main/$file"
      - name: Start llama.cpp
        run: |
          docker run -d --name llama -p 8080:8080 -v "$PWD/models:/models" ghcr.io/ggml-org/llama.cpp:server \
            -m /models/model.gguf --jinja -c 16384 -np 1 --host 0.0.0.0 --port 8080
          for i in $(seq 1 120); do curl -sf localhost:8080/health && break; sleep 5; done
          curl -sf localhost:8080/health || { docker logs llama; exit 1; }
      # Routing by meaning, as on the laptop with FastFlowLM's embed-gemma:300m, for the
      # variants that route (below 16K context); the shipped setup sends every tool. If
      # the model can't be found or won't start, the eval runs with keywords only.
      - name: Start the embedding model
        id: embed
        continue-on-error: true
        run: |
          python3 -c 'import json,sys; sys.exit(0 if json.load(open("core/eval/variants.json"))[sys.argv[1]].get("route_tools") else 1)' \
            "${{ matrix.variant }}" || { echo "Doesn't route: no embedding model."; exit 0; }
          read -r repo file < <(python3 .github/scripts/find_gguf.py "embeddinggemma-300m" Q8_0)
          echo "Using $repo / $file"
          curl -sSfL --retry 3 -o models/embed.gguf "https://huggingface.co/$repo/resolve/main/$file"
          docker run -d --name embed -p 8081:8081 -v "$PWD/models:/models" ghcr.io/ggml-org/llama.cpp:server \
            -m /models/embed.gguf --embeddings -c 2048 --host 0.0.0.0 --port 8081
          for i in $(seq 1 60); do curl -sf localhost:8081/health && break; sleep 2; done
          curl -sf localhost:8081/health || { docker logs embed; exit 1; }
          echo "url=http://127.0.0.1:8081" >> "$GITHUB_OUTPUT"
      - name: Run the scenarios
        run: |
          chmod +x assistantd
          only=()
          if [ -n "${{ inputs.only }}" ]; then only=(--only "${{ inputs.only }}"); fi
          embed=()
          if [ -n "${{ steps.embed.outputs.url }}" ]; then embed=(--embed-url "${{ steps.embed.outputs.url }}"); fi
          ./assistantd --eval --url http://127.0.0.1:8080 --model "${{ matrix.m.model }}" "${embed[@]}" \
            --variant "${{ matrix.variant }}" --repeat "${{ inputs.repeat || '1' }}" --json report.json "${only[@]}" \
            --shard "${{ matrix.shard }}/${{ inputs.shards || '3' }}"
      - name: Summary
        if: always()
        run: |
          [ -f report.json ] || exit 0
          { echo "### ${{ matrix.m.model }} · ${{ matrix.variant }} (${{ steps.gguf.outputs.source }})"
            python3 .github/scripts/eval_table.py report.json; } >> "$GITHUB_STEP_SUMMARY"
          cp report.json "report-$(echo '${{ matrix.m.model }}-${{ matrix.variant }}-${{ matrix.shard }}' | tr ':' '_').json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: report-${{ strategy.job-index }}
          path: report-*.json
          if-no-files-found: ignore

  summary:
    needs: eval
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@v4
        with:
          pattern: report-*
          merge-multiple: true
      - name: All models
        run: |
          ls report-*.json >/dev/null 2>&1 || { echo "No reports." >> "$GITHUB_STEP_SUMMARY"; exit 0; }
          { python3 .github/scripts/eval_verdict.py report-*.json; echo "## Model scores"; python3 .github/scripts/eval_table.py report-*.json; } >> "$GITHUB_STEP_SUMMARY"
