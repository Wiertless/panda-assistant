name: ci
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch: # release the version in src/panda_assistant/__init__.py from main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install test dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3-gi gir1.2-glib-2.0 desktop-file-utils appstream \
            gsettings-desktop-schemas gnome-settings-daemon-common
      - name: Unit tests
        run: make test PYTHON=/usr/bin/python3
      - name: Validate desktop and AppStream files
        run: |
          desktop-file-validate data/*.desktop
          appstreamcli validate --no-net data/*.metainfo.xml

  core:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libglib2.0-dev libgdk-pixbuf-2.0-dev python3-gi
      - name: Lint and test the Rust service
        working-directory: core
        run: |
          cargo clippy --all-targets -- -D warnings
          PANDA_PYTHON=/usr/bin/python3 cargo test

  release:
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    needs: test
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Work out the version
        id: ver
        run: |
          v=$(sed -n 's/^VERSION = "\(.*\)"/\1/p' src/panda_assistant/__init__.py)
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "v$v" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME != VERSION $v" >&2; exit 1
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - name: Build and publish the release tarball
        env:
          GH_TOKEN: ${{ github.token }}
          V: ${{ steps.ver.outputs.version }}
        run: |
          make dist VERSION="$V"
          sha256sum "panda-assistant-$V.tar.gz" | tee "panda-assistant-$V.tar.gz.sha256"
          # Creates the v$V tag on this commit when it doesn't exist yet.
          gh release create "v$V" --target "$GITHUB_SHA" "panda-assistant-$V.tar.gz" "panda-assistant-$V.tar.gz.sha256" \
            --title "Panda $V" --notes "Install: \`./install.sh /usr\` from the extracted tarball."
