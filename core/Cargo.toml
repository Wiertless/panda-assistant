[package]
name = "assistant-core"
version = "0.22.0"
edition = "2024"
license = "MIT"
description = "Background service for the Assistant app: model, tools, memory, MCP"
publish = false

[[bin]]
name = "assistantd"
path = "src/main.rs"

[dependencies]
gio = "0.21"
glib = "0.21"
gdk-pixbuf = "0.21"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "3", default-features = false, features = ["rustls", "platform-verifier", "gzip"] }
regex = "1"
libloading = "0.8"

[dev-dependencies]
tempfile = "3"

